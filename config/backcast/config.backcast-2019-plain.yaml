run:
  name: backcast-2019-plain

renewable:
  hydro:
    flatten_dispatch: false

conventional:
  nuclear:
    p_min_pu: 0
  lignite:
    p_min_pu: 0
  biomass:
    p_min_pu: 0
  waste:
    p_min_pu: 0
  marginal_cost_spread:
    enable: false

costs:
  custom_cost_fn: data/custom_costs.csv

backcast:
  calibrate_wind: false
  monthly_nuclear_availability: false
  hybrid_capacities:
    enable: false
