run:
  name: backcast-2023

planning_horizons: [2023]

snapshots:
  start: "2023-01-01"
  end: "2024-01-01"

sector:
  enabled: false

atlite:
  default_cutout: europe-2023-sarah3-era5

electricity:
  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []
  transmission_limit: v1.0
  cross_border_capacities: ntc
  powerplants_filter: "(DateOut >= 2023 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn)"
  estimate_renewable_capacities:
    from_powerplantmatching: false
    from_irenastat: true
    year: 2023

conventional:
  dynamic_fuel_price: true
  fuel_price_rolling_window: 1
  fuel_price_nominal: true
  estimate_efficiencies:
    enable: true
    reference_year: 2023

costs:
  year: 2020
  emission_prices:
    dynamic: true
    rolling_window: 1

transmission_projects:
  enable: false

lines:
  under_construction: zero

links:
  under_construction: zero

co2_budget:
  relative: false
  upper:
  lower:

clustering:
  mode: administrative
  administrative:
    level: bz
  build_bidding_zones:
    remove_islands: true
  copperplate_regions:
  - [DE00, LUG1]
  - [GBNI, IE00]
  consider_efficiency_classes: true
  cluster_network:
    allow_ac_dc_mixing_in_bus_clusters: true

solving:
  options:
    load_shedding:
      enable: true
      default_cost: 4000
    noisy_costs: false

backcast:
  exclude_price_areas: [AL, BA, GB, ME, MK, XK]
  exclude_price_buses: [FR15]
  max_price_gap_hours_by_area:
    IE_SEM: 25
  fixed_border_capacities:
    DK_1-GB: 0
    FI-SE_2: 0
    IT_CALA-IT_CSUD: 0
    FR-IT_CNOR: physical
    FR-IT_SARD: physical
  exchange_proxy_borders: [BE-NL, DE_LU-NL]
